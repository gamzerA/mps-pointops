name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and validate the release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install build twine PyYAML
          python -m unittest discover -s tools -p test_validate_release.py
          python tools/validate_release.py --tag "$RELEASE_TAG"
          python -m build
          python -m twine check dist/*
          python tools/validate_release.py --tag "$RELEASE_TAG" --dist dist --output release-validation.json
      - uses: actions/upload-artifact@v5
        with:
          name: release-validation
          path: release-validation.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
