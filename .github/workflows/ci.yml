name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }}, torch ${{ matrix.torch || 'latest' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon runners. MPS tests run if the runner exposes the GPU
          # to PyTorch and are skipped otherwise; the log says which.
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.12"
          # Oldest supported combination: torch.mps.compile_shader is new in 2.7.
          - os: macos-latest
            python: "3.10"
            torch: "2.7.0"
          # CPU-only: reference implementations, fallbacks and the stand-ins.
          - os: ubuntu-latest
            python: "3.12"
    env:
      PYTORCH_ENABLE_MPS_FALLBACK: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install PyTorch (CPU build)
        if: runner.os == 'Linux'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install PyTorch
        if: runner.os == 'macOS' && !matrix.torch
        run: python -m pip install torch
      - name: Install PyTorch ${{ matrix.torch }}
        if: runner.os == 'macOS' && matrix.torch
        run: python -m pip install "torch==${{ matrix.torch }}"
      - name: Install the package and test dependencies
        # A regular (non-editable) install, so the tests use the built package
        # and its bundled .metal files.
        run: python -m pip install . pytest numpy
      - name: Environment
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then sysctl -n machdep.cpu.brand_string; fi
          python -c "import platform, torch, mps_pointops; print(platform.platform()); print('torch', torch.__version__, '| mps_pointops', mps_pointops.__version__); print('MPS available:', torch.backends.mps.is_available())"
      - name: Tests (Metal safe math)
        # `pytest` rather than `python -m pytest`, so the repository directory is
        # not put on sys.path ahead of the installed package.
        run: pytest -ra tests
      - name: Tests (Metal fast math)
        if: runner.os == 'macOS'
        env:
          PYTORCH_MPS_FAST_MATH: "1"
        run: pytest -ra tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Check distribution contents
        run: |
          python - <<'EOF'
          import glob, tarfile, zipfile
          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          required = {
              "mps_pointops/kernels/fps.metal",
              "mps_pointops/kernels/fps_multigroup.metal",
              "mps_pointops/kernels/knn.metal",
              "mps_pointops/kernels/feature_knn.metal",
              "mps_pointops/kernels/nearest.metal",
              "mps_pointops/kernels/graclus.metal",
              "mps_pointops/kernels/ball_query.metal",
              "mps_pointops/kernels/fps_flat.metal",
              "mps_pointops/kernels/flat_search.metal",
              "mps_pointops/kernels/pointnet2.metal",
              "mps_pointops/kernels/chamfer_nn.metal",
              "mps_pointops/pytorch3d.py",
              "mps_pointops/pointnet2.py",
              "mps_pointops/chamfer.py",
              "mps_pointops/nearest.py",
              "mps_pointops/graclus.py",
          }
          missing = required - names
          licenses = [n for n in names if "/licenses/" in n]
          print("licenses:", licenses)
          assert not missing, f"missing from wheel: {missing}"
          assert len(licenses) >= 2, "LICENSE files missing from wheel"
          with tarfile.open(glob.glob("dist/*.tar.gz")[0]) as archive:
              sdist_names = archive.getnames()
          assert any(name.endswith("/CITATION.cff") for name in sdist_names), \
              "CITATION.cff missing from source distribution"
          EOF

  pyg-2-8:
    name: PyG 2.8 MPS operators
    runs-on: macos-latest
    env:
      PYTORCH_ENABLE_MPS_FALLBACK: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PyG 2.8 and its matching pyg-lib wheel
        run: |
          python -m pip install "torch==2.12.0"
          python -m pip install . pytest "torch-geometric==2.8.0"
          python -m pip install --no-index \
            --find-links 'https://data.pyg.org/whl/torch-2.12.0+cpu.html' \
            'pyg-lib==0.7.0+pt212'
      - name: Require MPS and print integration versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import torch

          print("torch", torch.__version__)
          print("torch-geometric", version("torch-geometric"))
          print("pyg-lib", version("pyg-lib"))
          assert torch.backends.mps.is_available(), "MPS is required for this job"
          PY
      - name: Diagnose hosted MPS Linear bias behavior
        run: |
          python - <<'PY'
          from copy import deepcopy
          import torch
          import pyg_lib  # noqa: F401
          from torch_geometric.nn import avg_pool_x, voxel_grid
          from mps_pointops.pyg import register_mps

          cpu_model = torch.nn.Linear(4, 3)
          with torch.no_grad():
              cpu_model.weight.copy_(torch.arange(12).reshape(3, 4) / 19)
              cpu_model.bias.copy_(torch.tensor([-0.25, 0.5, 0.75]))
          mps_model = deepcopy(cpu_model).to('mps')

          def report(label, x_cpu, x_mps):
              print(label)
              print('x CPU:', x_cpu)
              print('x MPS:', x_mps.cpu())
              for device, x, model in [('CPU', x_cpu, cpu_model),
                                        ('MPS', x_mps, mps_model)]:
                  with torch.no_grad():
                      mm = x @ model.weight.T
                      bias = model.bias
                      added = mm + bias
                      fused = torch.addmm(bias, x, model.weight.T)
                      linear = model(x)
                  torch.mps.synchronize()
                  for name, value in [('xW^T', mm), ('b', bias),
                                      ('xW^T+b', added), ('addmm', fused),
                                      ('Linear', linear)]:
                      print(device, name, value.detach().cpu(),
                            'norm=', value.detach().float().norm().item())
                  print(device, 'max|Linear-(mm+b)|=',
                        (linear - added).abs().max().item())
                  print(device, 'max|Linear-mm|=',
                        (linear - mm).abs().max().item())

          direct = torch.arange(16, dtype=torch.float32).reshape(4, 4) / 7
          report('standalone', direct, direct.to('mps'))

          register_mps()
          pos = torch.tensor([[-0.25], [0.0], [0.5], [1.0], [0.0], [1.0]])
          batch = torch.tensor([0, 0, 0, 0, 2, 2])
          features = torch.arange(24, dtype=torch.float32).reshape(6, 4) / 7
          cpu_id = voxel_grid(pos[:, 0], 1.0, batch, start=0.0, end=2.0)
          mps_id = voxel_grid(pos[:, 0].to('mps'), 1.0, batch.to('mps'),
                              start=0.0, end=2.0)
          cpu_x, _ = avg_pool_x(cpu_id, features, batch)
          mps_x, _ = avg_pool_x(mps_id, features.to('mps'), batch.to('mps'))
          print('grid IDs equal:', torch.equal(cpu_id, mps_id.cpu()))
          print('pooled max difference:', (cpu_x - mps_x.cpu()).abs().max().item())
          report('voxel pooled', cpu_x, mps_x)
          PY
      - name: PyG integration (Metal safe math)
        run: pytest -ra tests/test_pyg28.py tests/test_pyg28_grid.py tests/test_pyg28_voxel_avg_pool.py
      - name: PyG integration (Metal fast math)
        env:
          PYTORCH_MPS_FAST_MATH: "1"
        run: pytest -ra tests/test_pyg28.py tests/test_pyg28_grid.py tests/test_pyg28_voxel_avg_pool.py
