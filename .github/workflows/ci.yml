name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }}, torch ${{ matrix.torch || 'latest' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon runners. MPS tests run if the runner exposes the GPU
          # to PyTorch and are skipped otherwise; the log says which.
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.12"
          # Oldest supported combination: torch.mps.compile_shader is new in 2.7.
          - os: macos-latest
            python: "3.10"
            torch: "2.7.0"
          # CPU-only: reference implementations, fallbacks and the stand-ins.
          - os: ubuntu-latest
            python: "3.12"
    env:
      PYTORCH_ENABLE_MPS_FALLBACK: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install PyTorch (CPU build)
        if: runner.os == 'Linux'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install PyTorch
        if: runner.os == 'macOS' && !matrix.torch
        run: python -m pip install torch
      - name: Install PyTorch ${{ matrix.torch }}
        if: runner.os == 'macOS' && matrix.torch
        run: python -m pip install "torch==${{ matrix.torch }}"
      - name: Install the package and test dependencies
        # A regular (non-editable) install, so the tests use the built package
        # and its bundled .metal files.
        run: python -m pip install . pytest numpy
      - name: Environment
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then sysctl -n machdep.cpu.brand_string; fi
          python -c "import platform, torch, mps_pointops; print(platform.platform()); print('torch', torch.__version__, '| mps_pointops', mps_pointops.__version__); print('MPS available:', torch.backends.mps.is_available())"
      - name: Require physical MPS for spatial parity
        if: runner.os == 'macOS'
        run: python -c "import torch; assert torch.backends.mps.is_available(), 'spatial parity requires MPS'"
      - name: Tests (Metal safe math)
        # `pytest` rather than `python -m pytest`, so the repository directory is
        # not put on sys.path ahead of the installed package.
        env:
          PYTORCH_MPS_FAST_MATH: "0"
        run: pytest -ra tests
      - name: Tests (Metal fast math)
        if: runner.os == 'macOS'
        env:
          PYTORCH_MPS_FAST_MATH: "1"
        run: pytest -ra tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and validate release artifacts
        run: |
          python -m pip install build twine PyYAML
          python -m unittest discover -s tools -p test_validate_release.py
          python tools/validate_release.py
          python -m build
          python -m twine check dist/*
          python tools/validate_release.py --dist dist --output release-validation.json
      - uses: actions/upload-artifact@v5
        with:
          name: release-validation-${{ github.run_id }}
          path: release-validation.json
          if-no-files-found: error

  pyg-2-8:
    name: PyG 2.8 MPS operators
    runs-on: macos-latest
    env:
      PYTORCH_ENABLE_MPS_FALLBACK: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PyG 2.8 and its matching pyg-lib wheel
        run: |
          python -m pip install "torch==2.12.0"
          python -m pip install . pytest "torch-geometric==2.8.0"
          python -m pip install --no-index \
            --find-links 'https://data.pyg.org/whl/torch-2.12.0+cpu.html' \
            'pyg-lib==0.7.0+pt212'
      - name: Require MPS and print integration versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import torch

          print("torch", torch.__version__)
          print("torch-geometric", version("torch-geometric"))
          print("pyg-lib", version("pyg-lib"))
          assert torch.backends.mps.is_available(), "MPS is required for this job"
          PY
      - name: PyG integration (Metal safe math)
        run: pytest -ra tests/test_pyg28.py tests/test_pyg28_grid.py tests/test_pyg28_voxel_avg_pool.py tests/test_pyg28_avg_pool_graph.py tests/test_voxel.py tests/test_voxel_fused.py
      - name: PyG integration (Metal fast math)
        env:
          PYTORCH_MPS_FAST_MATH: "1"
        run: pytest -ra tests/test_pyg28.py tests/test_pyg28_grid.py tests/test_pyg28_voxel_avg_pool.py tests/test_pyg28_avg_pool_graph.py tests/test_voxel.py tests/test_voxel_fused.py
