<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 276" role="img" aria-labelledby="title description">
<title id="title">Three point-cloud operators on Apple Silicon</title>
<desc id="description">Farthest point sampling selects spread-out centers; k nearest neighbors ranks by distance; Ball Query keeps the first K points inside a radius.</desc>
