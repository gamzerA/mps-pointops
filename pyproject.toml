[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mps-pointops"
version = "0.0.1"
description = "Point cloud ops (FPS, kNN, ball query) for PyTorch on Apple Silicon (MPS)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "numpy"]

[project.optional-dependencies]
bench = ["scipy", "fpsample"]

[tool.setuptools]
packages = ["mps_pointops"]
